# Render Blueprint for the backend. The frontend is deployed separately on Vercel.
services:
  - type: web
    name: mediscan-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: CORS_ORIGINS          # set to your Vercel URL, e.g. https://mediscan-ai.vercel.app
        sync: false
      - key: MAX_UPLOAD_MB
        value: "10"
